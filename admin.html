<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stryve Track Admin</title>
<link rel="icon" type="image/png" href="icon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="firebase-config.js"></script>
<script type="module" src="cloud.js" onerror="window.__cloudFail=1"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14161a;--mu:#6b7280;--ac:#ff5a1f;--ac2:#ff9a3d;--ln:#e5e7eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0e0f12;--card:#1a1c21;--tx:#f3f4f6;--mu:#9ca3af;--ln:#2a2d34}}
*{box-sizing:border-box}html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
main{max-width:560px;margin:0 auto;padding:16px}
.hero{padding:20px 18px;background:linear-gradient(135deg,#ff4d17,#ff8a3d 65%,#ffb347);color:#fff;border-radius:26px;margin-bottom:16px;box-shadow:0 10px 26px rgba(255,90,31,.3)}
.hs{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.9;font-weight:700}h1{margin:4px 0;font-size:30px}#who{font-size:13px;opacity:.9}
h2{font-size:15px;margin:0 0 10px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:16px;margin-bottom:14px}
label{display:block;font-size:12px;color:var(--mu);margin:0 0 4px}
input{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:11px;min-height:46px;margin-bottom:10px}
input:focus{outline:none;border-color:var(--ac)}
button,a.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 12px;min-height:42px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
#tadd,#gsign{width:100%;min-height:46px}
button.sec,a.btn{background:var(--bg);color:var(--tx);border:1px solid var(--ln)}
.tr{padding:12px 0;border-top:1px solid var(--ln)}.tr:first-of-type{border-top:0}
.tr b{display:block}.tr span{color:var(--mu);font-size:13px;word-break:break-all}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.acts>*{flex:1;min-width:84px;font-size:14px;min-height:38px}
.cl{margin-top:8px;font-size:14px}.cl div{padding:6px 0;border-top:1px dashed var(--ln)}.cl span{display:block}
.empty{color:var(--mu);text-align:center;padding:14px 0;font-size:14px}
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#gate[hidden]{display:none}.gbody{max-width:360px;text-align:center}.gt{font-size:24px;font-weight:800;margin:8px 0}
.foot{text-align:center;margin-top:16px;font-size:14px}.foot a{color:var(--ac);font-weight:600}
#gate{background:#09090b;color:#f3f4f6;overflow:hidden}
#gate::before{content:"";position:absolute;inset:-10%;background:radial-gradient(520px 420px at 88% 8%,rgba(255,90,31,.38),transparent 62%),radial-gradient(480px 420px at 6% 96%,rgba(255,154,61,.26),transparent 60%);animation:gpulse 7s ease-in-out infinite alternate}
#gate::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:38px 38px;-webkit-mask-image:radial-gradient(circle at 50% 40%,#000 20%,transparent 75%);mask-image:radial-gradient(circle at 50% 40%,#000 20%,transparent 75%)}
@keyframes gpulse{from{opacity:.75;transform:scale(1)}to{opacity:1;transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){#gate::before{animation:none}}
#gate .gbody{position:relative;z-index:1;width:100%;max-width:370px;padding:30px 24px 24px;text-align:center;background:rgba(18,18,22,.78);border:1px solid rgba(255,255,255,.09);border-radius:28px;box-shadow:0 24px 70px rgba(0,0,0,.6);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
#gate .glogo{width:132px;height:auto;display:block;margin:0 auto 4px;filter:drop-shadow(0 8px 22px rgba(255,90,31,.5))}
#gate .gname{font-size:12px;font-weight:800;letter-spacing:.38em;color:#ff8a3d;margin-bottom:14px}
#gate .gt{font-size:30px;font-weight:900;letter-spacing:.12em;margin:4px 0 2px;background:linear-gradient(135deg,#ff4d17,#ffb347);-webkit-background-clip:text;background-clip:text;color:transparent}
#gate .gbody p{color:#a1a1aa;font-size:14px;margin:6px 0 18px}
#gate .gtag{letter-spacing:.04em}
#gate .gnote{font-size:12px!important;margin:12px 0 0!important}
#gate button{width:100%;min-height:50px;font-size:16px;border-radius:14px}
#gate #gsign{background:#fff;color:#111;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 24px rgba(255,90,31,.25)}
#gate svg.gg{width:20px;height:20px;display:inline-block}
#gate .gor{display:flex;align-items:center;gap:10px;color:#6b7280;font-size:12px;margin:14px 0}
#gate .gor::before,#gate .gor::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.12)}
#gate button.sec{background:transparent;color:#ff8a3d;border:1.5px solid rgba(255,138,61,.6);box-shadow:none}
#gate .gsup{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:2;text-align:center;font-size:13px;color:#8b8b94}
#gate .gsup a{color:#ff8a3d;font-weight:700;text-decoration:none}
select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:11px;min-height:46px;margin-bottom:10px}
.ck{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--tx);margin:6px 0}
.ck input{width:20px;height:20px;min-height:0;margin:0}
.mvmsg{color:var(--mu);font-size:13px;margin-top:6px}
</style>
</head>
<body>
<div id="gate"><div class="gbody"><p>Loading…</p><p style="font-size:13px">If this stays on screen, open the page from your website link in Safari, not from the Files app or a preview.</p><noscript><p>JavaScript is turned off, so this page cannot run.</p></noscript></div><div class="gsup">Need help? <a href="mailto:nihalstryve@gmail.com">nihalstryve@gmail.com</a></div></div>
<main>
  <header class="hero"><div class="hs">Stryve Track</div><h1>Admin</h1><div id="who"></div></header>
  <div id="app" hidden>
    <div class="card"><h2>Give a trainer access</h2>
      <label>Trainer’s Google email</label><input id="te" type="email" inputmode="email" autocapitalize="off" autocomplete="off" placeholder="name@gmail.com">
      <label>Name</label><input id="tn" placeholder="Trainer name" maxlength="40">
      <button id="tadd">Give access</button>
    </div>
    <div class="card"><h2>Trainers</h2><div id="tl"></div></div>
    <div class="foot"><a href="index.html">Open trainer page</a> · <a href="#" id="out">Sign out</a></div>
  </div>
</main>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var esc=function(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML};
  window.addEventListener("error",function(e){var g=document.getElementById("gate");if(g){g.hidden=false;document.querySelector(".gbody").innerHTML='<p>Something went wrong:</p><p>'+String(e.message||"unknown error")+'</p>'}});
  var me="",GL='<img class="glogo" alt="" src="icon.png" style="width:92px;border-radius:24px"><div class="gname">STRYVE TRACK \u00b7 ADMIN</div>',BTN='<button id="gsign"><svg class="gg" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.2 6.9-10.3 6.9-17.7z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.7-6c-2.1 1.4-4.9 2.3-8.2 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Sign in with Google</button>';
  function gate(h){$("gate").hidden=!h;document.querySelector(".gbody").innerHTML=h||"";$("app").hidden=!!h}
  function row(t){return'<div class="tr" data-e="'+esc(t.email)+'" data-act="'+(t.active===false?0:1)+'"><b>'+esc(t.name||t.email)+'</b><span>'+esc(t.email)+' \u00b7 '+(t.active===false?"Revoked":"Active")+' \u00b7 <em class="cnt">\u2026</em></span><div class="acts"><button class="sec" data-a="view">Clients</button><button class="sec" data-a="move">Transfer</button><a class="btn" href="index.html#as='+encodeURIComponent(t.email)+'">Open</a><button class="sec" data-a="tog">'+(t.active===false?"Restore":"Revoke")+'</button><button class="sec" data-a="del">Remove</button></div><div class="cl"></div></div>'}
  async function refresh(){
    var l=await FB.trainers();l.sort(function(a,b){return(a.name||a.email).localeCompare(b.name||b.email)});
    $("tl").innerHTML=l.length?l.map(row).join(""):'<div class="empty">No trainers yet. Add one above.</div>';
    document.querySelectorAll(".tr").forEach(function(r){FB.count(r.dataset.e).then(function(n){r.querySelector(".cnt").textContent=n+(n===1?" client":" clients")}).catch(function(){r.querySelector(".cnt").textContent="?"})});
  }
  async function openMove(r,e){
    var box=r.querySelector(".cl"),c=(await FB.clients(e)).filter(function(x){return !x.archived}),tr=await FB.trainers();
    var opts=tr.filter(function(x){return x.email!==e&&x.active!==false});
    if(!c.length){box.innerHTML='<div class="empty">This trainer has no clients to transfer.</div>';return}
    if(!opts.length){box.innerHTML='<div class="empty">Add another active trainer first.</div>';return}
    box.innerHTML='<label>Transfer to</label><select class="mvto">'+opts.map(function(x){return'<option value="'+esc(x.email)+'">'+esc(x.name||x.email)+' ('+esc(x.email)+')</option>'}).join("")+'</select><label>Clients to move</label>'+c.map(function(x){return'<label class="ck"><input type="checkbox" class="mvck" value="'+esc(x.id)+'" checked>'+esc(x.name||"Client")+'</label>'}).join("")+'<button data-a="domove" style="width:100%;margin-top:8px">Transfer selected clients</button><div class="mvmsg"></div>';
  }
  async function doMove(r,e,b){
    var box=r.querySelector(".cl"),to=box.querySelector(".mvto").value,ids=[].slice.call(box.querySelectorAll(".mvck:checked")).map(function(i){return i.value});
    if(!ids.length){box.querySelector(".mvmsg").textContent="Select at least one client.";return}
    b.disabled=true;b.textContent="Transferring\u2026";
    var n=0;
    try{for(var i=0;i<ids.length;i++){if(await FB.moveClient(e,to,ids[i]))n++}}
    catch(x){alert("Transfer stopped after "+n+" client(s): "+(x.code||x.message))}
    alert("Moved "+n+(n===1?" client":" clients")+" to "+to+". Ask both trainers to reload their page.");
    refresh();
  }
  $("tadd").addEventListener("click",async function(){
    var e=$("te").value.trim().toLowerCase(),n=$("tn").value.trim();
    if(e.indexOf("@")<1){alert("Enter a valid Google email.");return}
    try{await FB.setTrainer(e,{name:n||e,active:true,addedBy:me,added:new Date().toISOString()});$("te").value="";$("tn").value="";refresh()}catch(x){alert("Could not save: "+(x.code||x.message))}
  });
  $("tl").addEventListener("click",async function(ev){
    var b=ev.target.closest("[data-a]");if(!b)return;var r=b.closest(".tr"),e=r.dataset.e,a=b.dataset.a;
    try{
      if(a==="move"){await openMove(r,e)}
      else if(a==="domove"){await doMove(r,e,b)}
      else if(a==="view"){
        var c=(await FB.clients(e)).filter(function(x){return !x.archived});
        r.querySelector(".cl").innerHTML=c.length?c.map(function(x){var d={};(x.entries||[]).forEach(function(y){d[y.date]=1});var ds=Object.keys(d).sort();return'<div><b>'+esc(x.name)+' \u00b7 '+(["Level not set","Beginner","Intermediate","Expert","Home DB"][x.level||0])+'</b><span>'+ds.length+' training days \u00b7 '+(ds.length?"last "+ds[ds.length-1]:"no workouts yet")+'</span></div>'}).join(""):'<div class="empty">No clients yet.</div>';
      }else if(a==="tog"){await FB.setTrainer(e,{active:r.dataset.act!=="1"});refresh()}
      else if(a==="del"){
        if(b.dataset.armed){await FB.removeTrainer(e);refresh()}
        else{b.dataset.armed=1;b.textContent="Tap again";setTimeout(function(){delete b.dataset.armed;b.textContent="Remove"},3000)}
      }
    }catch(x){alert("Failed: "+(x.code||x.message))}
  });
  $("out").addEventListener("click",function(ev){ev.preventDefault();FB.signOut().then(function(){location.reload()})});
  $("gate").addEventListener("click",function(ev){var b=ev.target.closest("button");if(!b)return;
    if(b.id==="gsign")FB.signIn().catch(function(x){gate(GL+'<p>Sign-in failed: '+esc(x.code||x.message)+'</p>'+BTN)});
    if(b.id==="gout")FB.signOut().then(function(){location.reload()})});
  function init(){
    clearTimeout(tm);
    if(!FB.ok){gate(GL+'<p>Add your Firebase config to firebase-config.js first.</p>');return}
    FB.onUser(async function(u){
      if(!u){gate(GL+'<div class="gt">Admin login</div><p>Sign in with the admin Google account.</p>'+BTN);return}
      me=(u.email||"").toLowerCase();gate("<p>Checking access\u2026</p>");
      var r;try{r=await FB.role(me)}catch(x){gate(GL+'<p>Could not check access.</p>');return}
      if(!r.admin){gate(GL+'<div class="gt">Admins only</div><p>'+esc(me)+' is not an admin.</p><button class="sec" id="gout">Sign out</button>');return}
      $("who").textContent=me;gate("");
      try{await refresh()}catch(x){$("tl").innerHTML='<div class="empty">Could not load trainers ('+esc(x.code||x.message)+').</div>'}
    });
  }
  var tm=setTimeout(function(){gate(GL+'<p>'+(window.__cloudFail?'cloud.js could not be loaded. Upload cloud.js next to admin.html.':!window.FB?'The login service did not start. Check your internet and that cloud.js is uploaded.':'Still loading.')+'</p>')},10000);
  gate("<p>Loading\u2026</p>");
  window.FB?init():window.addEventListener("fbready",init);
})();
</script>
</body>
</html>
